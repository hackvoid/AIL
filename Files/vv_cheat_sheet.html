<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Cheat Sheet & Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabler-icons@latest/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body { font-family: var(--font-mono, 'Courier New', monospace); }

    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f5f5f5;
      --color-background-tertiary: #fafafa;
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --color-border-primary: #d0d0d0;
      --color-border-secondary: #e0e0e0;
      --color-border-tertiary: #eeeeee;
    }

    [data-theme="dark"] {
      --color-background-primary: #1e1e1e;
      --color-background-secondary: #2d2d2d;
      --color-background-tertiary: #252525;
      --color-text-primary: #e0e0e0;
      --color-text-secondary: #a0a0a0;
      --color-text-tertiary: #707070;
      --color-border-primary: #404040;
      --color-border-secondary: #333333;
      --color-border-tertiary: #2a2a2a;
    }

    .root {
      background: var(--color-background-tertiary);
      min-height: 100vh;
      padding: 0;
    }

    .header {
      border-bottom: 1.5px solid var(--color-border-primary);
      padding: 1.25rem 1.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header-left {
      display: flex;
      align-items: flex-end;
      gap: 30px;
      flex: 1;
      min-width: 300px;
    }

    .header-title {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--color-text-primary);
      margin-bottom: 0;
    }

    .header-main {
      font-size: 20px;
      font-weight: 500;
      color: var(--color-text-primary);
      letter-spacing: -0.02em;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .header-btn {
      background: transparent;
      border: 0.5px solid var(--color-border-secondary);
      color: var(--color-text-secondary);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font-mono);
    }
    .header-btn:hover {
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
      border-color: var(--color-border-secondary);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
      align-items: center;
      position: relative;
    }

    .import-export-dropdown {
      position: relative;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 180px;
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-secondary);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 30;
    }

    .dropdown-menu.active {
      display: flex;
    }

    .dropdown-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--color-text-primary);
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 11px;
      transition: background 0.15s, color 0.15s;
    }

    .dropdown-item:hover {
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-secondary);
      border-radius: 6px;
      padding: 6px 12px;
      min-width: 180px;
    }

    .search-bar i { color: var(--color-text-secondary); font-size: 15px; }
    .search-bar input {
      border: none;
      background: transparent;
      outline: none;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--color-text-primary);
      width: 100%;
    }
    .search-bar input::placeholder { color: var(--color-text-tertiary); }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-label {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-tertiary);
      min-width: 50px;
      text-align: right;
    }

    .toggle-slider {
      width: 48px;
      height: 22px;
      background: var(--color-background-secondary);
      border: 0.5px solid var(--color-border-secondary);
      border-radius: 11px;
      cursor: pointer;
      position: relative;
      transition: background 0.3s;
    }

    .toggle-slider.active { background: #4CAF50; }
    .toggle-slider::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: left 0.3s ease-in-out;
    }
    .toggle-slider.active::after { left: 28px; }

    .tab-bar {
      display: flex;
      gap: 0;
      border-bottom: 0.5px solid var(--color-border-tertiary);
      padding: 0 1.5rem;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--color-background-secondary);
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    .tab {
      font-family: var(--font-mono);
      font-size: 11.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-text-secondary);
      padding: 10px 14px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 0.15s;
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab:hover { color: var(--color-text-primary); }
    .tab.active { color: var(--color-text-primary); border-bottom-color: var(--color-text-primary); }

    .tab-delete {
      font-size: 14px;
      background: transparent;
      border: none;
      color: #ff6b6b;
      cursor: pointer;
      padding: 0 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .tab:hover .tab-delete { opacity: 1; }
    .tab-delete:hover { color: #ff5252; }
    .tab-delete {
      font-size: 14px;
      background: transparent;
      border: none;
      color: #ff6b6b;
      cursor: pointer;
      padding: 0 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .tab:hover .tab-delete { opacity: 1; }
    .tab-delete:hover { color: #ff5252; }

    .content {
      padding: 1.25rem 1.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px;
    }

    .card {
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: 8px;
      padding: 1rem 1.1rem;
      cursor: pointer;
      transition: border-color 0.15s;
      position: relative;
    }

    .card:hover { border-color: var(--color-border-secondary); }
    .card.add-card {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 150px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .card.add-card:hover { opacity: 1; }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .card-title-group { flex: 1; }

    .card-tag {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .tag-file    { background: #E6F1FB; color: #0C447C; }
    .tag-diag    { background: #FAECE7; color: #712B13; }
    .tag-proto   { background: #EAF3DE; color: #27500A; }
    .tag-tool    { background: #EEEDFE; color: #3C3489; }
    .tag-test    { background: #FAEEDA; color: #633806; }
    .tag-calib   { background: #E1F5EE; color: #085041; }
    .tag-script  { background: #FBEAF0; color: #72243E; }

    @media (prefers-color-scheme: dark) {
      .tag-file    { background: #0C447C; color: #B5D4F4; }
      .tag-diag    { background: #712B13; color: #F5C4B3; }
      .tag-proto   { background: #27500A; color: #C0DD97; }
      .tag-tool    { background: #3C3489; color: #CECBF6; }
      .tag-test    { background: #633806; color: #FAC775; }
      .tag-calib   { background: #085041; color: #9FE1CB; }
      .tag-script  { background: #72243E; color: #F4C0D1; }
    }

    [data-theme="dark"] .tag-file    { background: #0C447C; color: #B5D4F4; }
    [data-theme="dark"] .tag-diag    { background: #712B13; color: #F5C4B3; }
    [data-theme="dark"] .tag-proto   { background: #27500A; color: #C0DD97; }
    [data-theme="dark"] .tag-tool    { background: #3C3489; color: #CECBF6; }
    [data-theme="dark"] .tag-test    { background: #633806; color: #FAC775; }
    [data-theme="dark"] .tag-calib   { background: #085041; color: #9FE1CB; }
    [data-theme="dark"] .tag-script  { background: #72243E; color: #F4C0D1; }

    .card-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--color-text-primary);
      letter-spacing: -0.01em;
    }

    .card-acronym {
      font-size: 11px;
      color: var(--color-text-tertiary);
      margin-top: 1px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.55;
      margin-top: 6px;
      font-family: var(--font-sans, sans-serif);
    }

    .card-bullets {
      margin-top: 8px;
      padding-left: 0;
      list-style: none;
    }

    .card-bullets li {
      font-size: 12px;
      color: var(--color-text-secondary);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding: 2px 0 2px 12px;
      position: relative;
    }

    .card-bullets li::before {
      content: '›';
      position: absolute;
      left: 0;
      color: var(--color-text-tertiary);
    }

    .card-links {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-link {
      font-size: 12px;
      color: #0066cc;
      text-decoration: none;
      padding: 2px 0;
      word-break: break-all;
    }

    .card-link:hover { text-decoration: underline; }

    .card-code {
      margin-top: 8px;
      background: var(--color-background-secondary);
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: 5px;
      padding: 7px 10px;
      font-size: 11.5px;
      color: var(--color-text-secondary);
      font-family: var(--font-mono);
      line-height: 1.6;
      word-break: break-all;
    }

    .card-image {
      margin-top: 8px;
      max-width: 100%;
      max-height: 150px;
      border-radius: 4px;
      cursor: zoom-in;
    }

    .card-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover .card-actions { opacity: 1; }

    .card-btn {
      background: var(--color-background-secondary);
      border: 0.5px solid var(--color-border-secondary);
      border-radius: 4px;
      padding: 4px 6px;
      cursor: pointer;
      color: var(--color-text-secondary);
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-btn:hover {
      background: var(--color-border-secondary);
      color: var(--color-text-primary);
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-text-tertiary);
      margin: 1.25rem 0 0.6rem;
      font-family: var(--font-sans);
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--color-text-tertiary);
      font-family: var(--font-sans);
      font-size: 14px;
    }

    /* Notes View Styles */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 1.25rem 1.5rem;
    }

    .note-item {
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: 8px;
      padding: 1.5rem;
      cursor: pointer;
      transition: border-color 0.15s;
      width: 100%;
    }

    .note-item:hover { border-color: var(--color-border-secondary); }

    .note-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--color-text-primary);
      margin-bottom: 4px;
    }

    .note-preview {
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.5;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .note-add {
      background: var(--color-background-primary);
      border: 0.5px dashed var(--color-border-secondary);
      border-radius: 8px;
      padding: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--color-text-secondary);
      transition: all 0.2s;
      font-size: 14px;
      width: 100%;
      min-height: 60px;
    }

    .note-add:hover {
      border-color: var(--color-text-secondary);
      color: var(--color-text-primary);
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--color-background-primary);
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem;
      border-bottom: 0.5px solid var(--color-border-tertiary);
      position: sticky;
      top: 0;
      background: var(--color-background-primary);
      z-index: 10;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 500;
      color: var(--color-text-primary);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      color: var(--color-text-secondary);
      cursor: pointer;
      padding: 0;
    }

    .modal-close:hover { color: var(--color-text-primary); }

    .modal-body {
      padding: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-secondary);
      display: block;
      margin-bottom: 6px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 8px 12px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: 6px;
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .form-textarea {
      font-family: var(--font-sans, sans-serif);
      resize: vertical;
      min-height: 100px;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: #4CAF50;
    }

    .button-group {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }

    .button {
      padding: 8px 16px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: 6px;
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 12px;
      transition: all 0.2s;
    }

    .button:hover {
      background: var(--color-border-secondary);
    }

    .button.primary {
      background: #4CAF50;
      color: white;
      border-color: #4CAF50;
    }

    .button.primary:hover {
      background: #45a049;
    }

    .button.danger {
      background: #f44336;
      color: white;
      border-color: #f44336;
    }

    .button.danger:hover {
      background: #da190b;
    }

    /* Image Zoom Modal */
    .image-zoom-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      cursor: zoom-out;
    }

    .image-zoom-modal.active { display: flex; }
    .image-zoom-modal img { max-width: 90vw; max-height: 90vh; }

    /* Rich Editor */
    .editor-toolbar {
      display: flex;
      gap: 4px;
      padding: 8px;
      background: var(--color-background-secondary);
      border: 0.5px solid var(--color-border-secondary);
      border-radius: 6px 6px 0 0;
      flex-wrap: wrap;
    }

    .editor-btn {
      padding: 6px 10px;
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
      color: var(--color-text-primary);
    }

    .editor-btn:hover {
      background: var(--color-border-secondary);
    }

    .editor-btn.active {
      background: #4CAF50;
      color: white;
      border-color: #4CAF50;
    }

    .editor-content {
      min-height: 300px;
      padding: 12px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: 0 0 6px 6px;
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.6;
      outline: none;
      overflow-y: auto;
    }

    .editor-content:focus {
      border-color: #4CAF50;
    }

    /* Utility */
    .highlight { background: #FAC775; color: #412402; border-radius: 2px; padding: 0 2px; }
    @media (prefers-color-scheme: dark) { .highlight { background: #633806; color: #FAC775; } }
    [data-theme="dark"] .highlight { background: #633806; color: #FAC775; }
  </style>
</head>
<body>

<div class="root" id="root">
  <div class="header">
    <div class="header-left">
      <div style="display: flex; align-items: center; gap: 1.5rem;">
        <div>
          <div class="header-title">Dynamic Cheat Sheet & Notes</div>
        </div>
        <div class="slider-group">
          <span class="slider-label">SHEET</span>
          <div class="toggle-slider" id="viewToggle" onclick="toggleView()"></div>
          <span class="slider-label" style="margin: 0 30px 0 -15px;;">NOTES</span>
          <span class="slider-label">LIGHT</span>
          <div class="toggle-slider" id="themeToggle" onclick="toggleTheme()"></div>
          <span class="slider-label" style="margin-left: -15px;">DARK</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="import-export-dropdown">
          <button class="header-btn" onclick="toggleImportExportDropdown(event)">Import/Export</button>
          <div class="dropdown-menu" id="importExportMenu">
            <button class="dropdown-item" onclick="closeImportExportDropdown(); importCards()">Import cards</button>
            <button class="dropdown-item" onclick="closeImportExportDropdown(); exportCards()">Export cards</button>
            <button class="dropdown-item" onclick="closeImportExportDropdown(); importNotes()">Import notes</button>
            <button class="dropdown-item" onclick="closeImportExportDropdown(); exportNotes()">Export notes</button>
          </div>
        </div>
      </div>
    </div>
    <div class="header-controls">
      <div class="search-bar" id="searchContainer" style="display: none;">
        <span style="color: var(--color-text-secondary);">🔍</span>
        <input type="text" id="search" placeholder="Search concepts..." oninput="filterCards()" />
      </div>
    </div>
  </div>

  <div class="tab-bar" id="tabBar" style="display: none;"></div>

  <div class="content" id="content"></div>
</div>

<!-- Image Zoom Modal -->
<div class="image-zoom-modal" id="imageZoomModal" onclick="closeImageZoom(event)">
  <img id="zoomImage" />
</div>

<!-- Card Editor Modal -->
<div class="modal-overlay" id="cardModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Edit Card</div>
      <button class="modal-close" onclick="closeCardModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Card Name</label>
        <input type="text" class="form-input" id="cardName" />
      </div>
      <div class="form-group">
        <label class="form-label">Acronym</label>
        <input type="text" class="form-input" id="cardAcronym" />
      </div>
      <div class="form-group">
        <label class="form-label">Tab Category</label>
        <select class="form-select" id="cardTab"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Tag</label>
        <select class="form-select" id="cardTag">
          <option value="file">File</option>
          <option value="diag">Diagnostic</option>
          <option value="proto">Protocol</option>
          <option value="tool">Tool</option>
          <option value="test">Test</option>

<script>
// ============ STATE MANAGEMENT ============
const DEFAULT_TABS = ["All", "Files & Formats", "Diagnostics","Protocols", "Vector Tools", "Other Tools", "Test Methods", "Calibration", "Scripting", "Signals & Troubleshooting",  "ECU Topology"];

let state = {
  cards: [],
  notes: [],
  tabs: DEFAULT_TABS,
  activeTab: "All",
  theme: localStorage.getItem('theme') || 'light',
  view: localStorage.getItem('view') || 'cheat', // 'cheat' or 'notes'
  searchQuery: '',
  editingCardId: null,
  editingNoteId: null,
};

// ============ INITIALIZATION ============
function init() {
  loadFromStorage();
  applyTheme();
  setupUI();
  document.addEventListener('click', closeImportExportDropdown);
  renderView();
}

function loadFromStorage() {
  const stored = localStorage.getItem('appState');
  if (stored) {
    const parsed = JSON.parse(stored);
    state.cards = parsed.cards || [];
    state.notes = parsed.notes || [];
    state.tabs = parsed.tabs || DEFAULT_TABS;
  } else {
    // Load default data on first run
    state.cards = getDefaultCards();
  }
}

function saveToStorage() {
  localStorage.setItem('appState', JSON.stringify({
    cards: state.cards,
    notes: state.notes,
    tabs: state.tabs,
  }));
}

function getDefaultCards() {
  return [
    // Files & Formats
    { id: genId(), tab: "Files & Formats", tag: "file", tagLabel: "File", name: "PAR File", acronym: "Parameter File", desc: "Stores ECU parameter values for measurement and calibration sessions. Loaded into CANape or similar tools to pre-configure which signals to measure and at what addresses.", bullets: ["Contains signal names, addresses, data types, scaling", "Linked to an A2L file — PAR gives the values, A2L gives the descriptions", "Saved after calibration sessions to preserve tuned values", "Common extension: .par (CANape), can also be project-specific"], links: [], code: null, image: null },
    { id: genId(), tab: "Files & Formats", tag: "file", tagLabel: "File", name: "A2L File", acronym: "ASAP2 Description File", desc: "The backbone of ECU calibration. Describes every measurable/calibratable variable inside the ECU — where it lives in memory, its data type, units, and conversion formula.", bullets: ["Generated by the ECU compiler (from AUTOSAR or handwritten C)", "Consumed by CANape, INCA, and other calibration tools", "Without a valid A2L, you can't read or write ECU internals via XCP", "Contains: MEASUREMENT (read-only), CHARACTERISTIC (writable), AXIS_PTS"], links: [], code: "/begin MEASUREMENT\n  EngineSpeed\n  \"Engine RPM\"\n  FLOAT32_IEEE 0x4000 1 0 0 8000\n/end MEASUREMENT", image: null },
    { id: genId(), tab: "Files & Formats", tag: "file", tagLabel: "File", name: "DBC File", acronym: "CAN Database File", desc: "Defines all CAN messages and signals on a given network. The single source of truth for what's on the bus. Edited in CANdb++ and consumed by CANalyzer, CANoe, and CANape.", bullets: ["Describes: message ID, cycle time, signals, bit position, scaling, value tables", "Required to decode raw CAN frames into human-readable values", "Extended by .sym (symbol files) for complex data types", "Always version-control your DBC — mismatch causes garbage data"], links: [], code: "BO_ 512 EngineData: 8 ECU1\n SG_ EngineSpeed : 0|16@1+ (0.5,0) [0|8000] \"rpm\"", image: null },
    { id: genId(), tab: "Files & Formats", tag: "file", tagLabel: "File", name: "LDF File", acronym: "LIN Description File", desc: "Equivalent of a DBC but for LIN buses. Describes frames, signals, schedules, and node definitions for a LIN cluster.", bullets: ["Contains node (master/slave) definitions", "Defines frame schedules and signal encoding", "Used in CANoe/CANalyzer with LIN hardware"], links: [], code: null, image: null },
    { id: genId(), tab: "Files & Formats", tag: "file", tagLabel: "File", name: "FIBEX / ARXML", acronym: "Network Description (FlexRay / AUTOSAR)", desc: "FIBEX is the FlexRay network description file. ARXML is the AUTOSAR system description format. Both can define Ethernet (SOME/IP) and complex network topologies.", bullets: ["ARXML used in multi-bus architectures: CAN + LIN + FlexRay + Ethernet", "Imported into CANoe's System Designer", "Contains PDU mappings, frame slots, cycle lengths", "AUTOSAR Adaptive uses ARXML extensively for service definitions"], links: [], code: null, image: null },
    { id: genId(), tab: "Files & Formats", tag: "file", tagLabel: "File", name: "HEX / S19 File", acronym: "Flash File (Intel HEX / Motorola S-Record)", desc: "Binary ECU firmware in text-encoded format. Used for ECU flashing via UDS programming sessions or bootloaders.", bullets: ["Intel HEX (.hex): used widely across toolchains", "Motorola S-Record (.s19, .srec): common in automotive ECUs", "Flashed via UDS service 0x34 (Request Download) + 0x36 (Transfer Data)", "CANoe's DiVa and vFlash handle automated flashing workflows"], links: [], code: null, image: null },
    { id: genId(), tab: "Files & Formats", tag: "file", tagLabel: "File", name: "MDF / MF4 File", acronym: "Measurement Data Format", desc: "Standard binary logging format for measurement data. Captures timestamped signal values during test runs.", bullets: ["MDF4 (.mf4) is the current standard — replaces older .dat formats", "Produced by CANalyzer, CANoe, CANape, DIAdem", "Can hold millions of signal samples at microsecond precision", "Opened and post-processed in DIAdem or CANape's analysis mode"], links: [], code: null, image: null },
    
    // Diagnostics
    { id: genId(), tab: "Diagnostics", tag: "diag", tagLabel: "Diag", name: "DTC", acronym: "Diagnostic Trouble Code", desc: "A standardized fault code stored in an ECU's non-volatile memory when a monitored function fails or goes out of range. The core output of OBD-II and UDS diagnostics.", bullets: ["Format: P0xxx (Powertrain), B0xxx (Body), C0xxx (Chassis), U0xxx (Network)", "Read with UDS service 0x19 (ReadDTCInformation)", "Each DTC has a status byte: confirmed, pending, test failed this cycle", "Freeze frame data is often stored alongside the DTC"], links: [], code: "P0300 → Random/Multiple Cylinder Misfire\nU0100 → Lost Comm with ECM/PCM A\nB0040 → Airbag System Fault", image: null },
    { id: genId(), tab: "Diagnostics", tag: "diag", tagLabel: "Diag", name: "DTC Status Byte", acronym: "ISO 14229-1 §11", desc: "An 8-bit mask that tells you the lifecycle state of a DTC — not just whether a fault exists, but how it behaved over drive cycles.", bullets: ["Bit 0: testFailed — fault active RIGHT NOW", "Bit 1: testFailedThisMonitoringCycle", "Bit 3: confirmedDTC — failed in ≥2 drive cycles (usually)", "Bit 6: testNotCompletedThisMonitoringCycle", "Bit 7: warningIndicatorRequested (MIL on)", "Always check the full byte — a cleared DTC can still have Bit 4 set (pendingDTC)"], links: [], code: "Status 0x29 → 0010 1001\nBit7:0 Bit6:0 Bit5:1 Bit4:0\nBit3:1 Bit2:0 Bit1:0 Bit0:1\n→ Confirmed + Active", image: null },
    { id: genId(), tab: "Diagnostics", tag: "diag", tagLabel: "Diag", name: "Freeze Frame", acronym: "Snapshot Data", desc: "A snapshot of key ECU parameters (speed, RPM, load, temperature) captured at the moment a DTC is triggered. Invaluable for root-cause analysis.", bullets: ["Read via UDS 0x19 subfunction 0x04 (reportDTCSnapshotRecordByDTCNumber)", "OBD-II mandates freeze frames for emissions-related DTCs (Mode $02)", "Each OEM defines which signals go into freeze frames", "In CANoe DIAgnosis, freeze frame data appears as decoded parameter records"], links: [], code: null, image: null },
    { id: genId(), tab: "Diagnostics", tag: "diag", tagLabel: "Diag", name: "UDS", acronym: "Unified Diagnostic Services — ISO 14229", desc: "The dominant diagnostic protocol in modern automotive ECUs. A request-response framework over CAN, LIN, FlexRay, or Ethernet.", bullets: ["Runs over transport layer: ISO 15765-2 (CAN TP) or DoIP (Ethernet)", "Key services: 0x10 (Session), 0x11 (Reset), 0x14 (Clear DTCs), 0x19 (Read DTCs), 0x22 (Read Data), 0x2E (Write Data), 0x27 (Security Access), 0x31 (Routine), 0x34-0x37 (Programming)", "Sessions: Default (0x01), Extended (0x03), Programming (0x02)", "Negative responses: 0x7F + SID + NRC (e.g. 0x22 = conditionsNotCorrect)"], links: [], code: "REQ: 10 03     → ExtendedDiagnosticSession\nRES: 50 03 00 19 01 F4\nREQ: 22 F1 90  → ReadDataByID (VIN)\nRES: 62 F1 90 <17-byte VIN>", image: null },
    { id: genId(), tab: "Diagnostics", tag: "diag", tagLabel: "Diag", name: "OBD-II / WWH-OBD", acronym: "On-Board Diagnostics", desc: "Legislated emissions diagnostics accessible to any generic scan tool. OBD-II is the US standard; WWH-OBD (ISO 27145) is the European evolution using UDS over CAN.", bullets: ["Mode 0x01: Current data (PIDs like 0x0C = RPM, 0x0D = speed)", "Mode 0x02: Freeze frame data", "Mode 0x03: Confirmed DTCs", "Mode 0x07: Pending DTCs", "Mode 0x09: Vehicle info (VIN, CALID, CVN)", "Pin 6 (CAN-H) + Pin 14 (CAN-L) on OBD-II connector → diagnostic bus"], links: [], code: null, image: null },
    { id: genId(), tab: "Diagnostics", tag: "diag", tagLabel: "Diag", name: "Security Access (0x27)", acronym: "Seed-Key Algorithm", desc: "A challenge-response handshake that unlocks restricted ECU functions (write data, flash programming, clear protected DTCs).", bullets: ["Request seed: 0x27 0x01 → ECU returns a random seed value", "Client computes key from seed using a shared algorithm (OEM-specific)", "Send key: 0x27 0x02 + computed key → ECU unlocks if correct", "Typical lockout: 3 failed attempts → ECU locks for N minutes", "Vector CANoe handles seed-key via DLL plugins (CDD/ODX import)"], links: [], code: "REQ: 27 01          → RequestSeed\nRES: 67 01 AB CD    → Seed=0xABCD\nREQ: 27 02 12 34    → SendKey\nRES: 67 02          → Unlocked ✓", image: null },
    { id: genId(), tab: "Diagnostics", tag: "diag", tagLabel: "Diag", name: "DoIP", acronym: "Diagnostics over IP — ISO 13400", desc: "Tunnels UDS messages over Ethernet (UDP/TCP). Required for high-bandwidth diagnostics in Ethernet-enabled vehicles and during ECU programming over IP.", bullets: ["Vehicle announcement: UDP port 13400, ECU broadcasts its logical address", "Activation request (TCP) before sending diagnostic messages", "Logical address replaces CAN ID as the ECU identifier", "CANoe supports DoIP natively with Ethernet hardware (e.g. VN5640)"], links: [], code: null, image: null },
    { id: genId(), tab: "Diagnostics", tag: "diag", tagLabel: "Diag", name: "CDD / ODX / PDX", acronym: "Diagnostic Descriptions", desc: "Standardized database formats that describe an ECU's full diagnostic capability — all DTCs, DIDs, routines, and sessions.", bullets: ["CDD: CANdela Studio's native format (Vector-specific)", "ODX (ASAM MCD-2D): open standard, importable into CANoe", "PDX: packaged ODX (.pdx = zipped ODX folder)", "CANoe's DiVa auto-generates test cases from CDD/ODX descriptions", "Always match CDD version to ECU SW version — mismatches cause NRC errors"], links: [], code: null, image: null },
    { id: genId(), tab: "Diagnostics", tag: "diag", tagLabel: "Diag", name: "KWP2000", acronym: "Keyword Protocol 2000 — ISO 14230", desc: "The predecessor to UDS. Still found in legacy ECUs, especially pre-2008 vehicles. Similar session/service model but different framing.", bullets: ["Physical layer: K-Line (single wire, not CAN)", "Services similar to UDS but different SIDs (e.g. ReadDataByLocalID vs 0x22)", "Largely superseded — but you'll encounter it in HIL rigs with legacy ECUs"], links: [], code: null, image: null },
    
    // Protocols
    { id: genId(), tab: "Protocols", tag: "proto", tagLabel: "Protocol", name: "CAN / CAN FD", acronym: "Controller Area Network", desc: "The dominant automotive bus. CAN FD (Flexible Data-rate) extends classic CAN to 64-byte payloads and up to 8 Mbit/s data phase speed.", bullets: ["Classic CAN: max 8 bytes/frame, up to 1 Mbit/s", "CAN FD: up to 64 bytes, data phase up to 8 Mbit/s, nominal up to 1 Mbit/s", "Arbitration: lower ID = higher priority (0x000 wins over 0x7FF)", "Error frames, stuff bits, ACK field — hardware handles automatically", "Monitor with CANalyzer or CANoe; DBC required to decode signals"], links: [], code: null, image: null },
    { id: genId(), tab: "Protocols", tag: "proto", tagLabel: "Protocol", name: "ISO 15765-2 (CAN TP)", acronym: "CAN Transport Protocol", desc: "Segments UDS messages longer than 8 bytes across multiple CAN frames. Handles flow control between tester and ECU.", bullets: ["Single Frame (SF): payload ≤7 bytes, sent in one CAN frame", "First Frame (FF): starts a multi-frame transfer", "Consecutive Frame (CF): subsequent chunks", "Flow Control (FC): ECU tells tester its buffer size and delay (STmin)", "Block Size (BS) and STmin tuning matters for programming performance"], links: [], code: "SF: 07 22 F1 90 00 00 00 00\nFF: 10 1A 62 F1 90 ...\nFC: 30 00 0A (BS=0, STmin=10ms)\nCF: 21 .. 22 .. (SN increments)", image: null },
    { id: genId(), tab: "Protocols", tag: "proto", tagLabel: "Protocol", name: "LIN", acronym: "Local Interconnect Network", desc: "Single-wire, low-speed (up to 20 kbit/s) bus used for non-critical body functions. Master sends schedule header, slave responds.", bullets: ["One master, up to 16 slaves — no arbitration needed", "Used for: windows, mirrors, seats, HVAC controls", "Described by LDF file; monitored in CANalyzer/CANoe", "Common issues: no response (slave dead), checksum errors, schedule violations"], links: [], code: null, image: null },
    { id: genId(), tab: "Protocols", tag: "proto", tagLabel: "Protocol", name: "FlexRay", acronym: "Deterministic High-Speed Bus", desc: "Time-triggered bus for safety-critical applications requiring determinism and redundancy (chassis control, brake-by-wire, steer-by-wire).", bullets: ["Up to 10 Mbit/s per channel, two redundant channels (A+B)", "Static + dynamic segment: guaranteed slots + flexible slots", "Cycle time is fixed (1–16 ms typical)", "Requires FIBEX description; niche hardware (VN7600 for Vector)"], links: [], code: null, image: null },
    { id: genId(), tab: "Protocols", tag: "proto", tagLabel: "Protocol", name: "SOME/IP", acronym: "Scalable service-Oriented MiddlewarE over IP", desc: "Ethernet-based service-oriented protocol for automotive. ECUs advertise services, other ECUs subscribe. Used in AUTOSAR Adaptive architectures.", bullets: ["Service Discovery (SOME/IP-SD): ECUs find services at runtime", "Client subscribes to events, server sends on change or periodically", "CANoe + Ethernet hardware monitors SOME/IP natively", "Wireshark (with automotive plugins) is also useful for debugging"], links: [], code: null, image: null },
    { id: genId(), tab: "Protocols", tag: "proto", tagLabel: "Protocol", name: "XCP", acronym: "Universal Measurement and Calibration Protocol", desc: "The standard protocol for reading and writing ECU memory during runtime. Used by CANape for live calibration and measurement.", bullets: ["Runs on top of CAN, USB, Ethernet, or SxI", "GET_DAQ_LIST: what signals can I read?", "SET_MTA + DOWNLOAD: write to calibration addresses", "Time-correlation: XCP timestamps sync with logger timestamps", "Replaces older CCP (CAN Calibration Protocol) — but CCP still exists"], links: [], code: "CONNECT → GET_STATUS → GET_ID\nSET_DAQ_LIST_MODE\nSTART_STOP_DAQ_LIST → data streams\nSET_MTA(addr) → DOWNLOAD(val)", image: null },

    { id: genId(), tab: "Vector Tools", tag: "tool", tagLabel: "Tool", name: "CANalyzer", acronym: "Network Analysis Tool", desc: "CANoe's lighter sibling — purely for monitoring and analysis, no simulation capability. Faster to set up for quick debugging sessions.", bullets: ["Trace, Statistics, Graphics, Data windows", "Cannot simulate nodes (that's CANoe's job)", "CAPL scripting still available for filters and triggers", "Ideal for: signal snooping, error frame hunting, timing analysis"], links: [], code: null, image: null },

    { id: genId(), tab: "Vector Tools", tag: "tool", tagLabel: "Tool", name: "CANdb++", acronym: "Database Editor for DBC/LDF files", desc: "Vector's database editor for creating and maintaining DBC (CAN) and LDF (LIN) files. Every signal used in CANoe/CANalyzer starts here.", bullets: ["Define message IDs, cycle times, transmitting nodes", "Define signals: bit start, length, byte order (Intel/Motorola), scaling, offset, unit", "Value tables: map raw integers to named states (e.g. 0=Off, 1=On, 2=Error)", "Attribute definitions: add metadata used by CANoe (e.g. GenSigSendType)", "Import/export: .dbc ↔ Excel, .sym, FIBEX"], links: [], code: null, image: null },

    { id: genId(), tab: "Vector Tools", tag: "tool", tagLabel: "Tool", name: "DIAdem", acronym: "Data Analysis & Report Tool (NI)", desc: "National Instruments tool (common alongside Vector suite) for post-processing large MDF measurement files. Not a Vector product but widely used in V&V workflows.", bullets: ["Loads MDF4 files directly from CANoe/CANape", "DataFinder: indexes and searches across thousands of measurement files", "Analysis scripts: VBAI/Python for automated pass/fail evaluation", "Report generator: auto-produces PDF reports from templates", "Navigator → Workbook → Script → Report: the typical DIAdem workflow"], links: [], code: null, image: null },

function genId() { return '_' + Math.random().toString(36).substr(2, 9); }

// ============ THEME & VIEW TOGGLES ============
function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('theme', state.theme);
  applyTheme();
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  const isDark = state.theme === 'dark';
  document.getElementById('themeToggle').classList.toggle('active', isDark);
}

function toggleView() {
  state.view = state.view === 'cheat' ? 'notes' : 'cheat';
  localStorage.setItem('view', state.view);
  const isNotes = state.view === 'notes';
  document.getElementById('viewToggle').classList.toggle('active', isNotes);
  renderView();
}

function toggleImportExportDropdown(event) {
  event.stopPropagation();
  document.getElementById('importExportMenu').classList.toggle('active');
}

function closeImportExportDropdown() {
  document.getElementById('importExportMenu').classList.remove('active');
}

function setupUI() {
  const isDark = state.theme === 'dark';
  document.getElementById('themeToggle').classList.toggle('active', isDark);
  
  const isNotes = state.view === 'notes';
  document.getElementById('viewToggle').classList.toggle('active', isNotes);
}

// ============ RENDERING ============
function renderView() {
  if (state.view === 'cheat') {
    renderCheatSheet();
  } else {
    renderNotesView();
  }
}

function renderCheatSheet() {
  document.getElementById('searchContainer').style.display = 'flex';
  document.getElementById('tabBar').style.display = 'flex';
  
  renderTabs();
  renderCards(document.getElementById('search').value);
}

function renderTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  state.tabs.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (t === state.activeTab ? ' active' : '');
    btn.textContent = t;
    btn.onclick = () => { state.activeTab = t; renderCards(state.searchQuery); };
    
    // Add delete button for custom tabs (not in DEFAULT_TABS)
    if (!DEFAULT_TABS.includes(t)) {
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'tab-delete';
      deleteBtn.textContent = '✕';
      deleteBtn.onclick = (e) => { 
        e.stopPropagation(); 
        if (confirm(`Delete tab "${t}"?`)) {
          deleteTab(t);
        }
      };
      btn.appendChild(deleteBtn);
    }
    
    bar.appendChild(btn);
  });
}

function renderCards(query) {
  state.searchQuery = (query || '').toLowerCase().trim();
  const container = document.getElementById('content');
  container.innerHTML = '';

  let filtered = state.cards.filter(c => {
    const tabMatch = state.activeTab === 'All' || c.tab === state.activeTab;
    const searchMatch = !state.searchQuery || [c.name, c.acronym, c.desc, ...(c.bullets || [])].join(' ').toLowerCase().includes(state.searchQuery);
    return tabMatch && searchMatch;
  });

  if (!filtered.length && state.searchQuery) {
    container.innerHTML = '<div class="empty-state">No concepts match your search.</div>';
    return;
  }

  if (state.activeTab === 'All' && !state.searchQuery) {
    const grouped = {};
    filtered.forEach(c => {
      if (!grouped[c.tab]) grouped[c.tab] = [];
      grouped[c.tab].push(c);
    });
    
    Object.keys(grouped).forEach(tab => {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = tab;
      container.appendChild(label);
      renderGrid(grouped[tab], container);
      
      // Add "Add Card" button at end of section
      const addGrid = document.createElement('div');
      addGrid.className = 'grid';
      const addCard = document.createElement('div');
      addCard.className = 'card add-card';
      addCard.innerHTML = '<span style="font-size: 40px; font-weight: 300; color: var(--color-text-secondary);">+</span>';
      addCard.onclick = () => openCardModal(null, tab);
      addGrid.appendChild(addCard);
      container.appendChild(addGrid);
    });
  } else {
    renderGrid(filtered, container);
    
    // Add "Add Card" button for current tab
    if (!state.searchQuery) {
      const addGrid = document.createElement('div');
      addGrid.className = 'grid';
      addGrid.style.marginTop = '1.5rem';
      const addCard = document.createElement('div');
      addCard.className = 'card add-card';
      addCard.innerHTML = '<span style="font-size: 40px; font-weight: 300; color: var(--color-text-secondary);">+</span>';
      addCard.onclick = () => openCardModal(null, state.activeTab);
      addGrid.appendChild(addCard);
      container.appendChild(addGrid);
    }
  }

  // Global Add Category button
  if (state.activeTab === 'All') {
    const addCatContainer = document.createElement('div');
    addCatContainer.style.padding = '1.25rem 1.5rem';
    addCatContainer.innerHTML = `
      <div style="padding: 1.5rem; background: var(--color-background-primary); border: 0.5px dashed var(--color-border-secondary); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--color-text-secondary); transition: all 0.2s; font-size: 14px;" onclick="openCategoryModal()">
        <span style="font-size: 18px;">+</span> New Category
      </div>
    `;
    container.appendChild(addCatContainer);
  }
}

function renderGrid(items, container) {
  const grid = document.createElement('div');
  grid.className = 'grid';
  items.forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';

    const tagClass = { file:'tag-file', diag:'tag-diag', proto:'tag-proto', tool:'tag-tool', test:'tag-test', calib:'tag-calib', script:'tag-script' }[c.tag];

    let inner = `<div style="padding-bottom: 1rem;">
      <div class="card-header">
        <div class="card-title-group">
          <div class="card-name">${highlightText(c.name)}</div>
          <div class="card-acronym">${highlightText(c.acronym)}</div>
        </div>
        <span class="card-tag ${tagClass}">${c.tagLabel}</span>
      </div>
      <div class="card-desc">${highlightText(c.desc)}</div>`;

    if (c.bullets && c.bullets.length) {
      inner += '<ul class="card-bullets">' + c.bullets.map(b => `<li>${highlightText(b)}</li>`).join('') + '</ul>';
    }

    if (c.links && c.links.length) {
      inner += '<div class="card-links">' + c.links.map(link => {
        const [url, label] = link.split('|').map(s => s.trim());
        return `<a href="${url}" target="_blank" class="card-link">${label || url}</a>`;
      }).join('') + '</div>';
    }

    if (c.image) {
      inner += `<img src="${c.image}" class="card-image" onclick="zoomImage(this.src)" />`;
    }

    if (c.code) {
      inner += `<div class="card-code">${highlightText(c.code.replace(/</g,'&lt;'))}</div>`;
    }

    inner += '</div>';
    inner += `<div class="card-actions">
      <button class="card-btn" onclick="openCardModal('${c.id}')" title="Edit">Edit</button>
      <button class="card-btn" onclick="deleteCard('${c.id}')" title="Delete">Delete</button>
    </div>`;

    card.innerHTML = inner;
    grid.appendChild(card);
  });
  container.appendChild(grid);
}

function highlightText(text) {
  if (!state.searchQuery) return text;
  const re = new RegExp('(' + state.searchQuery.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return text.replace(re, '<span class="highlight">$1</span>');
}

function renderNotesView() {
  document.getElementById('searchContainer').style.display = 'none';
  document.getElementById('tabBar').style.display = 'none';
  const container = document.getElementById('content');
  container.innerHTML = '<div class="notes-container"></div>';
  const notesContainer = container.querySelector('.notes-container');

  state.notes.forEach(note => {
    const noteItem = document.createElement('div');
    noteItem.className = 'note-item';
    const preview = note.content.replace(/<[^>]+>/g, '').substring(0, 100);
    noteItem.innerHTML = `
      <div class="note-title">${note.title || 'Untitled'}</div>
      <div class="note-preview">${preview}${preview.length > 100 ? '...' : ''}</div>
    `;
    noteItem.onclick = () => openNoteModal(note.id);
    notesContainer.appendChild(noteItem);
  });

  const addNote = document.createElement('div');
  addNote.className = 'note-add';
  addNote.innerHTML = '<span style="font-size: 18px;">+</span> New Note';
  addNote.onclick = () => openNoteModal(null);
  notesContainer.appendChild(addNote);
}

// ============ MODALS ============
function openCardModal(cardId, defaultTab) {
  state.editingCardId = cardId;
  
  // Populate tabs
  const tabSelect = document.getElementById('cardTab');
  tabSelect.innerHTML = state.tabs.filter(t => t !== 'All').map(t => 
    `<option value="${t}" ${t === (defaultTab || 'Files & Formats') ? 'selected' : ''}>${t}</option>`
  ).join('');

  if (cardId) {
    const card = state.cards.find(c => c.id === cardId);
    document.getElementById('cardName').value = card.name;
    document.getElementById('cardAcronym').value = card.acronym;
    document.getElementById('cardTab').value = card.tab;
    document.getElementById('cardTag').value = card.tag;
    document.getElementById('cardDesc').value = card.desc;
    document.getElementById('cardBullets').value = (card.bullets || []).join('\n');
    document.getElementById('cardLinks').value = (card.links || []).join('\n');
    document.getElementById('cardCode').value = card.code || '';
    document.getElementById('cardImage').value = card.image || '';
    document.getElementById('deleteCardBtn').style.display = 'block';
  } else {
    document.getElementById('cardName').value = '';
    document.getElementById('cardAcronym').value = '';
    document.getElementById('cardDesc').value = '';
    document.getElementById('cardBullets').value = '';
    document.getElementById('cardLinks').value = '';
    document.getElementById('cardCode').value = '';
    document.getElementById('cardImage').value = '';
    document.getElementById('deleteCardBtn').style.display = 'none';
  }

  document.getElementById('cardModal').classList.add('active');
}

function closeCardModal() {
  document.getElementById('cardModal').classList.remove('active');
  state.editingCardId = null;
}

function saveCard() {
  const name = document.getElementById('cardName').value.trim();
  const acronym = document.getElementById('cardAcronym').value.trim();
  if (!name || !acronym) { alert('Name and Acronym are required'); return; }

  const card = {
    id: state.editingCardId || genId(),
    name,
    acronym,
    tab: document.getElementById('cardTab').value,
    tag: document.getElementById('cardTag').value,
    tagLabel: document.getElementById('cardTag').value.charAt(0).toUpperCase() + document.getElementById('cardTag').value.slice(1),
    desc: document.getElementById('cardDesc').value,
    bullets: document.getElementById('cardBullets').value.split('\n').filter(b => b.trim()),
    links: document.getElementById('cardLinks').value.split('\n').filter(l => l.trim()),
    code: document.getElementById('cardCode').value.trim() || null,
    image: document.getElementById('cardImage').value.trim() || null,
  };

  if (state.editingCardId) {
    const idx = state.cards.findIndex(c => c.id === state.editingCardId);
    state.cards[idx] = card;
  } else {
    state.cards.push(card);
  }

  saveToStorage();
  closeCardModal();
  renderCards(state.searchQuery);
}

function deleteCard(cardId) {
  if (confirm('Delete this card?')) {
    state.cards = state.cards.filter(c => c.id !== cardId);
    saveToStorage();
    closeCardModal();
    renderCards(state.searchQuery);
  }
}

function openNoteModal(noteId) {
  state.editingNoteId = noteId;
  if (noteId) {
    const note = state.notes.find(n => n.id === noteId);
    document.getElementById('noteTitle').value = note.title;
    document.getElementById('noteContent').innerHTML = note.content;
    document.getElementById('deleteNoteBtn').style.display = 'block';
  } else {
    document.getElementById('noteTitle').value = '';
    document.getElementById('noteContent').innerHTML = '';
    document.getElementById('deleteNoteBtn').style.display = 'none';
  }
  document.getElementById('noteModal').classList.add('active');
}

function closeNoteModal() {
  document.getElementById('noteModal').classList.remove('active');
  state.editingNoteId = null;
}

function saveNote() {
  const title = document.getElementById('noteTitle').value.trim() || 'Untitled';
  const content = document.getElementById('noteContent').innerHTML;

  const note = {
    id: state.editingNoteId || genId(),
    title,
    content,
    created: state.editingNoteId ? state.notes.find(n => n.id === state.editingNoteId).created : new Date().toISOString(),
  };

  if (state.editingNoteId) {
    const idx = state.notes.findIndex(n => n.id === state.editingNoteId);
    state.notes[idx] = note;
  } else {
    state.notes.push(note);
  }

  saveToStorage();
  closeNoteModal();
  renderNotesView();
}

function deleteNote() {
  if (confirm('Delete this note?')) {
    state.notes = state.notes.filter(n => n.id !== state.editingNoteId);
    saveToStorage();
    closeNoteModal();
    renderNotesView();
  }
}

function openCategoryModal() {
  document.getElementById('categoryName').value = '';
  document.getElementById('categoryModal').classList.add('active');
}

function closeCategoryModal() {
  document.getElementById('categoryModal').classList.remove('active');
}

function createCategory() {
  const name = document.getElementById('categoryName').value.trim();
  if (!name) { alert('Category name required'); return; }
  if (state.tabs.includes(name)) { alert('Category already exists'); return; }
  
  state.tabs.push(name);
  saveToStorage();
  closeCategoryModal();
  state.activeTab = name;
  renderCheatSheet();
}

// ============ UTILITIES ============
function zoomImage(src) {
  document.getElementById('zoomImage').src = src;
  document.getElementById('imageZoomModal').classList.add('active');
}

function closeImageZoom(e) {
  if (e.target.id === 'imageZoomModal') {
    document.getElementById('imageZoomModal').classList.remove('active');
  }
}

// ============ RICH EDITOR ============
function execCommand(command, value = null) {
  document.execCommand(command, false, value);
  document.getElementById('noteContent').focus();
}

function insertList() {
  document.execCommand('insertUnorderedList');
  document.getElementById('noteContent').focus();
}

function insertImage() {
  const url = prompt('Image URL:');
  if (url) {
    document.execCommand('insertImage', false, url);
    document.getElementById('noteContent').focus();
  }
}

// ============ SEARCH ============
function filterCards() {
  renderCards(document.getElementById('search').value);
}

// ============ IMPORT/EXPORT ============
function exportCards() {
  const exportData = {
    cards: state.cards,
    tabs: state.tabs
  };
  const data = JSON.stringify(exportData, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cards_export.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importCards() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        let cardsToImport = Array.isArray(imported) ? imported : imported.cards;
        let tabsToImport = imported.tabs || [];
        
        if (!Array.isArray(cardsToImport)) { alert('Invalid format: expected array of cards'); return; }
        
        const choice = prompt('Choose action:\n1 = Replace all cards\n2 = Append to existing cards', '2');
        if (choice === '1') {
          state.cards = cardsToImport;
          state.tabs = tabsToImport.length > 0 ? tabsToImport : DEFAULT_TABS;
        } else if (choice === '2') {
          state.cards = [...state.cards, ...cardsToImport];
          if (tabsToImport.length > 0) {
            tabsToImport.forEach(t => {
              if (!state.tabs.includes(t)) {
                state.tabs.push(t);
              }
            });
          }
        } else {
          return;
        }
        saveToStorage();
        renderCheatSheet();
        alert('Cards imported successfully!');
      } catch (err) {
        alert('Error parsing file: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function exportNotes() {
  const data = JSON.stringify(state.notes, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'notes_export.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importNotes() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!Array.isArray(imported)) { alert('Invalid format: expected array of notes'); return; }
        const choice = prompt('Choose action:\n1 = Replace all notes\n2 = Append to existing notes', '2');
        if (choice === '1') {
          state.notes = imported;
        } else if (choice === '2') {
          state.notes = [...state.notes, ...imported];
        } else {
          return;
        }
        saveToStorage();
        renderNotesView();
        alert('Notes imported successfully!');
      } catch (err) {
        alert('Error parsing file: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function deleteTab(tabName) {
  state.tabs = state.tabs.filter(t => t !== tabName);
  state.cards = state.cards.filter(c => c.tab !== tabName);
  if (state.activeTab === tabName) {
    state.activeTab = 'All';
  }
  saveToStorage();
  renderCheatSheet();
}

// ============ START ============
init();
</script>
