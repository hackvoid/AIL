site_name: Kineton Academy Wiki
site_description: Bootcamp knowledge base for automotive E/E engineering
docs_dir: docs
edit_uri: ""
use_directory_urls: true
theme:
  name: material
  custom_dir: theme/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
extra_css:
  - assets/theme/kineton.css
extra_javascript:
  - assets/theme/mermaid.min.js
  - assets/theme/kineton-chat.js
  - assets/theme/kineton-mermaid.js
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: kx-mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
exclude_docs: |
  *.mp3
